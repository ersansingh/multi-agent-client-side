openapi: 3.0.0
info:
  title: Ride Booking API
  description: Uber-like API for booking rides and managing drivers.
  version: 1.0.0
servers:
  - url: https://api.rideshare.example.com/v1
components:
  schemas:
    Location:
      type: object
      properties:
        lat:
          type: number
          format: float
        long:
          type: number
          format: float
      required:
        - lat
        - long
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
    Ride:
      type: object
      properties:
        ride_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        pickup_location:
          $ref: '#/components/schemas/Location'
        drop_location:
          $ref: '#/components/schemas/Location'
        status:
          type: string
          enum: [REQUESTED, ACCEPTED, STARTED, COMPLETED, CANCELLED]
        fare:
          type: number
          format: float
    Driver:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        available:
          type: boolean
    FareEstimation:
      type: object
      properties:
        pickup_location:
          $ref: '#/components/schemas/Location'
        drop_location:
          $ref: '#/components/schemas/Location'
        estimated_fare:
          type: number
          format: float
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /auth/register:
    post:
      summary: Register user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: User registered
  /auth/login:
    post:
      summary: Login
      responses:
        '200':
          description: Login successful
  /profile:
    get:
      summary: Get profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /rides:
    post:
      summary: Request ride
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pickup_location:
                  $ref: '#/components/schemas/Location'
                drop_location:
                  $ref: '#/components/schemas/Location'
      responses:
        '201':
          description: Ride requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
  /rides/{ride_id}:
    get:
      summary: Get ride status
      parameters:
        - name: ride_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ride details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
  /rides/{ride_id}/cancel:
    post:
      summary: Cancel ride
      parameters:
        - name: ride_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ride cancelled
  /rides/estimate:
    post:
      summary: Fare estimation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pickup_location:
                  $ref: '#/components/schemas/Location'
                drop_location:
                  $ref: '#/components/schemas/Location'
      responses:
        '200':
          description: Estimated fare
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FareEstimation'
  /drivers/register:
    post:
      summary: Register driver
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Driver'
      responses:
        '201':
          description: Driver registered
  /drivers/availability:
    patch:
      summary: Update availability
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                available:
                  type: boolean
      responses:
        '200':
          description: Availability updated
  /drivers/rides/{ride_id}/accept:
    post:
      summary: Accept ride
      security:
        - BearerAuth: []
      parameters:
        - name: ride_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ride accepted
webhooks:
  rideUpdate:
    post:
      requestBody:
        description: Information about a ride update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ride'
      responses:
        '200':
          description: Webhook received
